name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch citations
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python google_scholar_crawler/main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google_scholar_crawler/results/gs_data.json
          git add google_scholar_crawler/results/gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Scholar citations"
            git push
          fi
